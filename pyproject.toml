[project]
name = "adb-mcp"
version = "0.1.0"
description = "MCP server exposing Android Debug Bridge (adb) tools: devices, apps, UI automation, logs, files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9,<2",
    "pillow>=10",
]

[project.scripts]
adb-mcp = "adb_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adb_mcp"]
